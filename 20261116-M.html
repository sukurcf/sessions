    add("Hooks and automations", "Automation choices", "agentic_workflows", full("Automation choices", "Automations repeat agent work; choose how the task is configured and maintained.",

    const deck = document.getElementById("deck");
    deck.innerHTML = slides.map((slide, index) => `<section class="slide" id="slide-${index + 1}" data-index="${index}" data-module="${slide.module}" data-print="${index + 1} / ${slides.length} | ${escapeHTML(slide.heading)} | GitHub Copilot" aria-label="${index + 1} of ${slides.length}: ${escapeHTML(slide.heading)}" aria-roledescription="slide" aria-hidden="true" inert>${slide.html}</section>`).join("");
    document.getElementById("rack-host").append(document.getElementById("rack-art").content.cloneNode(true));
    const sections = Array.from(deck.children);
    const contentsDialog = document.getElementById("contents-dialog");
    const notesDialog = document.getElementById("notes-dialog");
    const previous = document.getElementById("previous-button");
    const next = document.getElementById("next-button");
    const sourceLink = document.getElementById("source-link");
    const status = document.getElementById("status");
    const progress = document.getElementById("progress");
    progress.setAttribute("aria-valuemax", String(slides.length));
    let current = -1;
    let rackTimer = 0;
    let rackSelected = 0;
    let rackInteracting = false;
    const reducedMotion = matchMedia("(prefers-reduced-motion: reduce)");
    const rackSlide = document.getElementById("rack-host").closest(".slide");
    const rackFrame = document.querySelector(".rack-frame");
    const rackButtons = Array.from(document.querySelectorAll("[data-session]"));
    const rackNames = ["Feature", "Tests", "Docs"];
    const rackReadout = document.getElementById("rack-readout");

    function selectRack(index) {
      rackSelected = index;
      rackButtons.forEach((button, i) => button.setAttribute("aria-pressed", String(i === index)));
      document.querySelectorAll("[data-tray]").forEach(tray => {
        const selected = Number(tray.dataset.tray) === index;
        tray.classList.toggle("selected", selected);
        tray.setAttribute("transform", selected ? tray.dataset.open : "translate(0 0)");
      });
      rackReadout.textContent = `${rackNames[index]}: separate checkout and branch`;
    }
    function scheduleRack() {
      clearTimeout(rackTimer);
      rackTimer = 0;
      if (document.hidden || reducedMotion.matches || rackInteracting || !rackSlide.classList.contains("active") || contentsDialog.open || notesDialog.open) return;
      rackTimer = setTimeout(() => { selectRack((rackSelected + 1) % rackNames.length); scheduleRack(); }, 4200);
    }
    rackButtons.forEach(button => button.addEventListener("click", () => selectRack(Number(button.dataset.session))));
    rackFrame.addEventListener("pointerenter", () => { rackInteracting = true; scheduleRack(); });
    rackFrame.addEventListener("pointerleave", () => { rackInteracting = rackFrame.contains(document.activeElement); scheduleRack(); });
    rackFrame.addEventListener("focusin", () => { rackInteracting = true; scheduleRack(); });
    rackFrame.addEventListener("focusout", event => { rackInteracting = rackFrame.contains(event.relatedTarget); scheduleRack(); });
    reducedMotion.addEventListener("change", scheduleRack);
    document.addEventListener("visibilitychange", scheduleRack);
    selectRack(0);

    const chapters = [...new Set(slides.map(slide => slide.chapter))];
    document.getElementById("chapter-grid").innerHTML = chapters.map(chapter => {
      const start = slides.findIndex(slide => slide.chapter === chapter);
      const end = slides.findLastIndex(slide => slide.chapter === chapter);
      return `<button type="button" data-jump="${start}"><span>${chapter}</span><small>${start + 1}-${end + 1}</small></button>`;
    }).join("");

    function show(index, updateHash = true) {
      const target = Math.max(0, Math.min(slides.length - 1, index));
      if (!Number.isInteger(target)) return;
      if (current >= 0) {
        sections[current].classList.remove("active");
        sections[current].setAttribute("aria-hidden", "true");
        sections[current].inert = true;
      }
      current = target;
      const active = sections[current];
      active.classList.add("active");
      active.setAttribute("aria-hidden", "false");
      active.inert = false;
      previous.disabled = current === 0;
      next.disabled = current === slides.length - 1;
      document.getElementById("counter").textContent = `${String(current + 1).padStart(2, "0")} / ${slides.length}`;
      document.getElementById("chapter-label").textContent = slides[current].chapter;
      document.getElementById("slide-announcement").textContent = `Slide ${current + 1} of ${slides.length}: ${slides[current].heading}`;
      document.getElementById("progress-fill").style.transform = `scaleX(${(current + 1) / slides.length})`;
      progress.setAttribute("aria-valuenow", String(current + 1));
      sourceLink.href = source(slides[current].module);
      sourceLink.textContent = slides[current].sourceLabel || "Documentation";
      sourceLink.setAttribute("aria-label", `Open the documentation for ${slides[current].heading}`);
      document.title = `${slides[current].heading} | GitHub Copilot | ${current + 1}/${slides.length}`;
      status.textContent = "";
      if (updateHash) history.replaceState(null, "", `#slide-${current + 1}`);
      scheduleRack();
    }
    function hashIndex() {
      const match = /^#slide-(\d+)$/.exec(location.hash);
      return match ? Number(match[1]) - 1 : 0;
    }
    function openContents() {
      if (notesDialog.open) notesDialog.close();
      contentsDialog.showModal();
      scheduleRack();
    }
    function openNotes() {
      if (contentsDialog.open) contentsDialog.close();
      const slide = slides[current];
      document.getElementById("notes-title").textContent = slide.heading;
      document.getElementById("notes-body").innerHTML = [
        ["Explain", slide.notes], ["Ask", slide.ask], ["Watch for", slide.watch]
      ].map(([label, content]) => `<div><strong>${label}</strong><p>${escapeHTML(content)}</p></div>`).join("");
      document.getElementById("notes-meta").innerHTML = `${current + 1} / ${slides.length} &nbsp; | &nbsp; ${external(source(slide.module), "Documentation")} &nbsp; | &nbsp; Content reviewed 13 November 2026`;
      notesDialog.showModal();
      scheduleRack();
    }
    function toggleTheme() {
      const light = document.documentElement.dataset.theme !== "light";
      document.documentElement.dataset.theme = light ? "light" : "dark";
      document.querySelector('meta[name="theme-color"]').content = light ? "#ffffff" : "#0d1117";
      document.getElementById("theme-button").setAttribute("aria-label", `Switch to ${light ? "dark" : "light"} theme (T)`);
    }
    async function toggleFullscreen() {
      try {
        if (document.fullscreenElement) await document.exitFullscreen();
        else if (document.documentElement.requestFullscreen) await document.documentElement.requestFullscreen();
        else status.textContent = "Full screen is not available here. Open the HTML file in a browser and use its full-screen command.";
      } catch (error) {
        status.textContent = "Full screen was not allowed. Use your browser's full-screen command.";
        console.warn("Full-screen request failed:", error);
      }
    }
    previous.addEventListener("click", () => show(current - 1));
    next.addEventListener("click", () => show(current + 1));
    document.getElementById("contents-button").addEventListener("click", openContents);
    document.getElementById("notes-button").addEventListener("click", openNotes);
    document.getElementById("theme-button").addEventListener("click", toggleTheme);
    document.getElementById("fullscreen-button").addEventListener("click", toggleFullscreen);
    document.querySelectorAll("[data-close]").forEach(button => button.addEventListener("click", () => document.getElementById(button.dataset.close).close()));
    document.querySelectorAll("[data-jump]").forEach(button => button.addEventListener("click", () => { contentsDialog.close(); show(Number(button.dataset.jump)); }));
    [contentsDialog, notesDialog].forEach(dialog => dialog.addEventListener("close", scheduleRack));
    window.addEventListener("hashchange", () => show(hashIndex(), false));
    document.addEventListener("keydown", event => {
      const target = event.target instanceof Element ? event.target : document.body;
      if (event.ctrlKey || event.metaKey || event.altKey || target.closest("input, textarea, select, [contenteditable='true']")) return;
      if (contentsDialog.open || notesDialog.open) return;
      if ((event.key === " " || event.key === "Enter") && target.closest("button, a")) return;
      const key = event.key.toLowerCase();
      if (["arrowright", "pagedown", " "].includes(key)) { event.preventDefault(); show(current + (event.shiftKey && key === " " ? -1 : 1)); }
      else if (["arrowleft", "pageup"].includes(key)) { event.preventDefault(); show(current - 1); }
      else if (key === "home") { event.preventDefault(); show(0); }
      else if (key === "end") { event.preventDefault(); show(slides.length - 1); }
      else if (key === "g" || key === "?") { event.preventDefault(); openContents(); }
      else if (key === "n") { event.preventDefault(); openNotes(); }
      else if (key === "t") { event.preventDefault(); toggleTheme(); }
      else if (key === "f") { event.preventDefault(); toggleFullscreen(); }
    });
    let touchStart = null;
    deck.addEventListener("pointerdown", event => {
      if (event.pointerType === "touch" && !event.target.closest("a, button")) touchStart = { x: event.clientX, y: event.clientY };
    });
    deck.addEventListener("pointerup", event => {
      if (!touchStart) return;
      const dx = event.clientX - touchStart.x;
      const dy = event.clientY - touchStart.y;
      touchStart = null;
      if (Math.abs(dx) > 75 && Math.abs(dy) < 60) show(current + (dx < 0 ? 1 : -1));
    });
    deck.addEventListener("pointercancel", () => { touchStart = null; });
    show(hashIndex());
  </script>
</body>
</html>
